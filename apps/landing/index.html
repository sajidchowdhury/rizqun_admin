    <title>রিজকুন — ঘরে বসে বাজার, মেডিসিন ও জরুরি সেবা</title>
    <meta
      name="description"
      content="বাজারের ভিড় আর সময়ের অভাবে ক্লান্ত? ঘরে বসে হোয়াটসঅ্যাপে একটি মেসেজ দিন। বাজার মূল্যে পবিত্র ও বিশুদ্ধ পণ্য নিরাপদে পৌঁছে যাবে আপনার হাতে। প্রতিটি কেনাকাটা থেকে একটি অংশ সরাসরি আলেমদের খেদমতে যায়।"
    />
    <meta
      name="keywords"
      content="রিজকুন, rizqun, গ্রোসারি ডেলিভারি, মেডিসিন ডেলিভারি, বাজার মূল্য, অর্ডার, হোয়াটসঅ্যাপ অর্ডার, Feni delivery"

      property="og:description"
      content="হোয়াটসঅ্যাপে এক ক্লিকে অর্ডার করুন। বাজার মূল্যে পবিত্র পণ্য, নিরাপদ ডেলিভারি, এবং প্রতিটি কেনাকাটা থেকে নেকির অংশ।"

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Google Fonts: Hind Siliguri (Bengali) + Playfair Display (Latin serif) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap"
      rel="stylesheet"
    />

    <!--
      Font CSS variables — globals.css references `--font-hind-siliguri`,
      `--font-playfair`, and `--font-geist-mono`. We declare them here so
      the Tailwind v4 `@theme inline` mapping resolves.
    -->
    <style>
      :root {
        --font-hind-siliguri: 'Hind Siliguri', ui-sans-serif, system-ui, sans-serif;
        --font-playfair: 'Playfair Display', ui-serif, Georgia, 'Times New Roman', serif;
        --font-geist-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          'Liberation Mono', 'Courier New', monospace;
      }
      html,
      body {
        font-family: var(--font-hind-siliguri);
      }
    </style>
  </head>
