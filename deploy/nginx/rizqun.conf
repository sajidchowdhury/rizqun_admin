# Nginx configuration for Rizqun — monorepo deployment
#
# One domain, three locations:
#   /            → public landing page (static, served from /var/www/rizqun-landing)
#   /operation/  → admin console (static SPA, served from /var/www/rizqun-operation)
#   /api/        → Express backend (proxied to localhost:3000)
#   /health      → Express health check (proxied to localhost:3000)
#
# Setup:
#   1. Copy this file to /etc/nginx/sites-available/rizqun
#   2. Replace YOUR_DOMAIN with your actual domain (e.g. rizqunbd.com)
#   3. ln -s /etc/nginx/sites-available/rizqun /etc/nginx/sites-enabled/
#   4. certbot --nginx -d YOUR_DOMAIN -d www.YOUR_DOMAIN
#   5. nginx -t && systemctl reload nginx

# ─── HTTP → HTTPS redirect ─────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS server ──────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS (enable only after confirming HTTPS works)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── Landing page (rizqunbd.com /) ───────────────────────────
    root /var/www/rizqun-landing;
    index index.html;
    location = / { try_files /index.html =404; }
    location / { try_files $uri $uri/ /index.html; }

    # ─── Admin console (rizqunbd.com/operation/) ─────────────────
    location /operation/ {
        alias /var/www/rizqun-operation/;
        try_files $uri $uri/ /operation/index.html;
    }

    # ─── API (rizqunbd.com/api) → Node.js on :3000 ──────────────
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        client_max_body_size 5m;
    }

    # Health check stays at root (not under /api) for uptime monitors
    location = /health {
        proxy_pass http://127.0.0.1:3000;
    }

    # ─── Product images (uploaded by admin) ─────────────────────
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
    }

    # ─── Static asset caching ────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ─── Gzip compression ───────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
